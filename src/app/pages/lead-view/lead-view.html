<div class="lead-view">

  <h1>Lead Details</h1>

  @if (lead) {

    <p>
      <strong>ID:</strong>
      {{ leadId }}
    </p>

    <p>
      <strong>Name:</strong>
      {{ lead.name }}
    </p>

    <p>
      <strong>Company:</strong>
      {{ lead.company }}
    </p>

    <p>
      <strong>Email:</strong>
      {{ lead.email }}
    </p>

    <p>
      <strong>Phone:</strong>
      {{ lead.phone }}
    </p>

    <p>
      <strong>Status:</strong>
      {{ lead.status }}
    </p>

  } @else {

    <p>Lead not found.</p>

  }

</div>
