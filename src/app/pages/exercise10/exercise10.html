<h1>Exercise 10 - HttpClient</h1>

<!-- Loading -->
<div *ngIf="loading">
  <h3>Loading users...</h3>
</div>

<!-- Error -->
<div *ngIf="errorMessage">
  <h3>{{ errorMessage }}</h3>
</div>

<!-- Success -->
<div *ngIf="!loading && !errorMessage">

  <!-- Test POST Button -->
  <button (click)="createUser()">
    Test POST Request
  </button>

  <br><br>

  <!-- User List -->
  <div
    class="user-card"
    *ngFor="let user of users">

    <h3>{{ user.name }}</h3>

    <p>Email: {{ user.email }}</p>

    <p>Phone: {{ user.phone }}</p>

    <p>Website: {{ user.website }}</p>

  </div>

</div>
