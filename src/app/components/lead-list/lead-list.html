<div class="search-box">

  <input
    #searchInput
    type="text"
    placeholder="Search leads..."
    [(ngModel)]="searchText" />

</div>

<div class="lead-container">

  <!-- Left Sidebar -->
  <div class="lead-sidebar">

    <!-- Lead Names -->
    <div
      class="lead-item"
      *ngFor="let lead of leads | leadFilter: searchText; let i = index">

      <a
        [routerLink]="['/lead', i + 1]">
        {{ lead.name }}
      </a>

    </div>

    <!-- Empty State -->
    <div
      class="empty-state"
      *ngIf="leads.length === 0">

      No leads yet.

    </div>

  </div>

</div>
