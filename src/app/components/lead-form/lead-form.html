<div class="form-card">

  <h2>Add New Lead</h2>

  <div class="form-group">
    <label>Name</label>
    <input
      type="text"
      placeholder="Enter name"
      [(ngModel)]="newLead.name">
  </div>

  <div class="form-group">
    <label>Company</label>
    <input
      type="text"
      placeholder="Enter company"
      [(ngModel)]="newLead.company">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      placeholder="Enter email"
      [(ngModel)]="newLead.email">
  </div>

  <div class="form-group">
    <label>Phone</label>
    <input
      type="text"
      placeholder="Enter phone"
      [(ngModel)]="newLead.phone">
  </div>

  <div class="form-group">
    <label>Status</label>

    <select [(ngModel)]="newLead.status">
      <option>New</option>
      <option>Contacted</option>
      <option>Qualified</option>
      <option>Won</option>
      <option>Lost</option>
    </select>

  </div>

  <button
    (click)="addLead()"
    [disabled]="!newLead.name || !newLead.email">

    Add Lead

  </button>

  <p
    class="text-red-500 mt-2"
    *ngIf="!newLead.name || !newLead.email">

    Name and Email are required.

  </p>

</div>
